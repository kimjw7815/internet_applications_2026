<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kim JiWoo | Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="header-root"></header>

  <main class="container">
    <section>
      <h2>Contact</h2>
      <div class="contact-layout">
        <div class="contact-info">
          <p>📧 이메일: rlex0815@gmail.com</p>
          <p>🔗 GitHub: <a href="https://github.com/kimjw7815">kimjw7815</a></p>
          <p>📝 Tistory: <a href="https://kimjw7815.tistory.com">kimjw7815.tistory.com</a></p>
        </div>
        
        <form class="contact-form" onsubmit="return false;">
          <div class="input-group">
            <label>이름</label>
            <input type="text" placeholder="이름을 입력하세요">
          </div>
          <div class="input-group">
            <label>메시지</label>
            <textarea rows="4" placeholder="메시지를 입력하세요"></textarea>
          </div>
          <button type="submit" class="submit-btn">보내기</button>
        </form>
      </div>
    </section>
  </main>

  <footer id="footer-root"></footer>
  <script src="script.js"></script>
</body>
</html>
