<!DOCTYPE html>
<html lang="ko" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kim JiWoo | comment</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header id="header-root"></header>

  <main class="container">
    <section>
      <div class="grid-container">
        <div class="card">
          <h2>Comment</h2>
          <button class="submit-btn" onclick="addNewComment()">새로운 댓글 달기</button>
          <ul id="commentList" style="list-style: none;"></ul>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer-root"></footer>
  <script src="script.js"></script>

  <script>
    // 마찬가지로 색 하드코딩 빼고 css 변수 추가해서 바꾸도록 해야함
    // 1. 부모 요소(ul) 찾기
    var parent = document.getElementById("commentList");
    // 2. 새로운 요소(li) 생성 및 내용 채우기
    function addNewComment() {
      const inputStr=prompt();
      var newLi = document.createElement("li");
      const now=new Date();
      newLi.innerHTML = now.toLocaleString()+"<br>"+ inputStr;
      // 3. 클릭 시 삭제되는 이벤트 리스너 등록
      newLi.onclick = function () {
        var p = this.parentElement; // 부모(ul) 찾기
        p.removeChild(this); // 부모에서 나(this)를 삭제
      };
      newLi.onmouseenter = function () {this.style.backgroundColor="#000000"}
      newLi.onmouseleave = function () {this.style.backgroundColor="#1e1e1e"}
      newLi.className="card";
      // 4. 부모 요소에 갖다 붙이기
      parent.appendChild(newLi);
    }
  </script>
</body>

</html>
