<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kim JiWoo | random</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="header-root"></header>

  <main class="container">
    <section>
      <div class="grid-container">
        <div class="card">
          <h2>랜덤 선택기</h2>
          
          <!-- CSS 폼 스타일 활용 -->
          <div class="contact-form">
            <div class="input-group">
              <label for="item-input" style="color: var(--text-secondary); font-size: 0.9rem;">선택 항목들을 쉼표(,)로 구분해서 입력하세요</label>
              <input type="text" id="item-input" placeholder="예: 짜장면, 짬뽕, 볶음밥">
            </div>
            <button type="button" class="submit-btn" onclick="pickRandom()">선택하기</button>
          </div>

          <!-- 결과 출력 영역 -->
          <div id="random-result" style="margin-top: 1.5rem; text-align: center;"></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer-root"></footer>
  <script src="script.js"></script>

  <script>
    function pickRandom() {
      const inputString = document.getElementById('item-input').value;
      const resultDiv = document.getElementById('random-result');

      if (!inputString.trim()) {
        resultDiv.innerHTML = `<h3 style="color: var(--secondary-color);">항목을 입력해주세요.</h3>`;
        return;
      }

      // 쉼표로 분리 후 양끝 공백 제거, 빈 항목 필터링
      const items = inputString.split(',').map(item => item.trim()).filter(item => item !== "");
      
      if (items.length === 0) {
        resultDiv.innerHTML = `<h3 style="color: var(--secondary-color);">유효한 항목이 없습니다.</h3>`;
        return;
      }

      const index = Math.floor(Math.random() * items.length);
      
      resultDiv.innerHTML = `
        <h3 style="font-weight: 500; color: var(--text-secondary);">당신의 선택은...</h3>
        <h2 style="color: var(--secondary-color); font-size: 2.5rem; margin: 0.5rem 0;">${items[index]}</h2>
        <h3 style="font-weight: 500; color: var(--text-secondary); display: inline;">입니다! ✨</h3>
      `;
    }
  </script>
</body>
</html>
