<!DOCTYPE html>
<html lang="ko" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kim JiWoo | DOM controll</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header id="header-root"></header>

  <main class="container">
    <section>
      <div class="grid-container">
        <div class="card">
          <h2>DOM controll</h2>
          <button class="submit-btn" onclick="toggleColor()">색 바꾸기</button>
          <button class="submit-btn" onclick="toggleFontSize()">크게 보기</button>
          <button class="submit-btn" onclick="toggleBgColor()">배경 강조</button>
          <button class="submit-btn" onclick="toggleVisibility()">숨기기/보이기</button>
        </div>
        <p class="card" id="example-card">
          예시
        </p>
      </div>
    </section>
  </main>

  <footer id="footer-root"></footer>
  <script src="script.js"></script>

  <script>
    // 버튼 누른 후 테마모드 변환 시 카드에 적용되지 않는 버그 있음.
    // defaultValue와 targetValue 모두 버튼을 누를 때, 함수가 호출될 때의 테마를 기반으로 선언되어야 함
    // 혹은 css 변수를 추가해 script에서는 css 변수의 참/거짓값만 toggle하게 해야 함.
    var exampleCard = document.getElementById('example-card')
    const cardStyle = exampleCard.style;

    const rootStyle = window.getComputedStyle(document.documentElement);
    
    const defaultColor=window.getComputedStyle(exampleCard).color;
    const targetColor=rootStyle.getPropertyValue('--primary-color').trim();

    const defaultSize=window.getComputedStyle(exampleCard).fontSize;
    const targetSize="64px";

    const defaultBgColor=window.getComputedStyle(exampleCard).backgroundColor;
    const targetBgColor=rootStyle.getPropertyValue('--text-secondary').trim();

    function toggleColor() {
      console.log("기존 color: "+cardStyle.color);
      if (cardStyle.color===defaultColor || cardStyle.color==="") cardStyle.color=targetColor;
      else cardStyle.color=defaultColor;
      console.log("수정한 color: "+cardStyle.color);
    }

    function toggleFontSize() {
      console.log("기존 fontSize: "+cardStyle.fontSize);
      if (cardStyle.fontSize===defaultSize || cardStyle.fontSize==="") cardStyle.fontSize=targetSize;
      else cardStyle.fontSize=defaultSize;
      console.log("수정한 fontSize: "+cardStyle.fontSize);
    }

    function toggleBgColor() {
      console.log("기존 backgroundColor: "+cardStyle.backgroundColor);
      if (cardStyle.backgroundColor===defaultBgColor || cardStyle.backgroundColor==="") cardStyle.backgroundColor=targetBgColor;
      else cardStyle.backgroundColor=defaultBgColor;
      console.log("수정한 backgroundColor: "+cardStyle.backgroundColor);
    }

    function toggleVisibility() {
      if (cardStyle.display == "none") {
        cardStyle.display = "block";
        console.log("수정: display=\"block\"");
      } else {
        cardStyle.display = "none";
        console.log("수정: display=\"none\"");
      }
    }
  </script>
</body>

</html>
